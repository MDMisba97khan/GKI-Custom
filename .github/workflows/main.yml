name: GKI Module Builder Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build KernelSU WiFi Module
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential bison flex libssl-dev libelf-dev \
            pkg-config python3 git curl wget unzip bc xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Download RTL8812AU Driver Source
        run: |
          mkdir -p ~/build/drivers
          cd ~/build/drivers
          echo "=== Downloading RTL8812AU source ==="
          curl -L --retry 3 --retry-delay 10 -H "Accept: application/octet-stream" \
            "https://github.com/aircrack-ng/rtl8812au/archive/refs/heads/master.tar.gz" \
            -o rtl8812au.tar.gz
          mkdir -p rtl8812au
          tar xzf rtl8812au.tar.gz --strip-components=1 -C rtl8812au/
          rm rtl8812au.tar.gz
          echo "=== Driver source extracted ==="
          ls ~/build/drivers/rtl8812au/

      - name: Apply Monitor Mode Patches
        run: |
          cd ~/build/drivers/rtl8812au
          echo "=== Applying monitor mode patches ==="
          sed -i 's/CONFIG_WIFI_MONITOR = n/CONFIG_WIFI_MONITOR = y/g' Makefile || true
          sed -i 's/# CONFIG_WIFI_MONITOR/CONFIG_WIFI_MONITOR = y/g' Makefile || true
          grep "CONFIG_WIFI_MONITOR" Makefile || echo "CONFIG_WIFI_MONITOR not found"

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: MDMisba97khan/realme_C51_C53_Note50_C60_C51_N53-AndroidU-kernel-source
          path: kernel_source/kernel
          ref: master
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Kernel Headers
        run: |
          cd kernel_source/kernel
          echo "=== Preparing kernel headers ==="
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          make ARCH=arm64 olddefconfig 2>&1 | tail -10 || echo "olddefconfig failed, continuing..."
          make ARCH=arm64 modules_prepare 2>&1 | tail -20 || echo "modules_prepare failed, continuing..."
          echo "=== Kernel headers prepared ==="

      - name: Build RTL8812AU.ko
        run: |
          cd ~/build/drivers/rtl8812au
          echo "=== Building RTL8812AU.ko ==="
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export KDIR=${GITHUB_WORKSPACE}/kernel_source/kernel
          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            KDIR=${KDIR} \
            EXTRA_CFLAGS="-DCONFIG_WIFI_MONITOR=1 -DCONFIG_CONCURRENT_MODE=1" \
            -j$(nproc) 2>&1 | tail -60
          echo "=== Build complete ==="
          if [ -f "8812au.ko" ]; then
            echo "✅ 8812au.ko built successfully!"
            ls -lh 8812au.ko
            file 8812au.ko
          elif [ -f "rtl8812au.ko" ]; then
            echo "✅ rtl8812au.ko built successfully!"
            ls -lh rtl8812au.ko
            file rtl8812au.ko
          else
            echo "❌ No .ko file found"
            find . -name "*.ko" -type f 2>/dev/null
          fi

      - name: Package KernelSU Module
        run: |
          echo "=== Packaging KernelSU-Next Module ==="
          MODULE_DIR="${HOME}/build/KSU_Omni_WiFi"
          mkdir -p "${MODULE_DIR}/system/lib/modules"
          mkdir -p "${MODULE_DIR}/system/etc/firmware"
          mkdir -p "${MODULE_DIR}/common"
          DRIVER_FILE=""
          if [ -f "${HOME}/build/drivers/rtl8812au/8812au.ko" ]; then
            DRIVER_FILE="${HOME}/build/drivers/rtl8812au/8812au.ko"
          elif [ -f "${HOME}/build/drivers/rtl8812au/rtl8812au.ko" ]; then
            DRIVER_FILE="${HOME}/build/drivers/rtl8812au/rtl8812au.ko"
          fi
          if [ -n "${DRIVER_FILE}" ]; then
            cp "${DRIVER_FILE}" "${MODULE_DIR}/system/lib/modules/"
            echo "✅ Driver copied"
          else
            echo "⚠️ No driver .ko found"
          fi
          printf 'id=KSU_Omni_WiFi\nname=KernelSU Omni WiFi Pack\nversion=1.0.0\nversionCode=1\nauthor=MDMisba97khan\ndescription=Enable Monitor Mode and Packet Injection for Realme Note 50 (RMX3834)\n' > "${MODULE_DIR}/module.prop"
          printf '#!/system/bin/sh\nMODPATH=${0%%/*}\nMODULES_DIR=${MODPATH}/system/lib/modules\nfor ko_file in ${MODULES_DIR}/*.ko; do\n    [ -f "${ko_file}" ] && insmod "${ko_file}"\ndone\n' > "${MODULE_DIR}/common/service.sh"
          chmod +x "${MODULE_DIR}/common/service.sh"
          printf '#!/system/bin/sh\nMODDIR=${0%%/*}\nchmod 0644 ${MODDIR}/system/lib/modules/*.ko 2>/dev/null\n' > "${MODULE_DIR}/install.sh"
          chmod +x "${MODULE_DIR}/install.sh"
          printf '#!/system/bin/sh\nMODDIR=${0%%/*}\nfor ko in ${MODDIR}/system/lib/modules/*.ko; do\n    [ -f "$ko" ] && chmod 0644 "$ko"\ndone\n' > "${MODULE_DIR}/post-fs-data.sh"
          chmod +x "${MODULE_DIR}/post-fs-data.sh"
          cd "${HOME}/build"
          zip -r -q KSU_Omni_WiFi_Pack.zip KSU_Omni_WiFi/
          if [ -f KSU_Omni_WiFi_Pack.zip ]; then
            echo "✅ ZIP created successfully!"
            ls -lh KSU_Omni_WiFi_Pack.zip
            sha256sum KSU_Omni_WiFi_Pack.zip
          else
            echo "❌ Failed to create ZIP"
            exit 1
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU_Omni_WiFi_Pack
          path: ~/build/KSU_Omni_WiFi_Pack.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: ~/build/KSU_Omni_WiFi_Pack.zip
          tag_name: v1.0.0-${{ github.run_number }}
          name: "KSU Omni WiFi Pack v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## KernelSU Omni WiFi Pack
            **Device:** Realme Note 50 (RMX3834) • **Kernel:** 5.15.178-android13 • **Android:** 15
            ### Supported: Alfa AWUS011ACS (RTL8812AU, USB ID: 0bda:c820)
            ### Features: Monitor Mode ✅ Packet Injection ✅
            ### Installation: KernelSU-Next → Modules → Install from storage → Reboot → Connect via OTG
            Built by GitHub Actions • Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
