name: GKI WiFi Module Builder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build mac80211 + rtl8812au
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential bison flex libssl-dev libelf-dev \
            pkg-config python3 git curl wget unzip bc xz-utils \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: Clone Kernel Source
        uses: actions/checkout@v4
        with:
          repository: MDMisba97khan/realme_C51_C53_Note50_C60_C51_N53-AndroidU-kernel-source
          path: kernel
          ref: master
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone RTL8812AU Driver
        run: |
          mkdir -p drivers
          curl -L --retry 3 --retry-delay 10 \
            "https://github.com/aircrack-ng/rtl8812au/archive/refs/heads/master.tar.gz" \
            -o rtl8812au.tar.gz
          mkdir -p drivers/rtl8812au
          tar xzf rtl8812au.tar.gz --strip-components=1 -C drivers/rtl8812au/
          rm rtl8812au.tar.gz

      - name: Build Kernel Modules (mac80211 + cfg80211)
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # Use gki_defconfig
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- gki_defconfig 2>&1 | tail -3

          # Enable mac80211 and cfg80211 as modules
          echo "CONFIG_MAC80211=m" >> .config
          echo "CONFIG_CFG80211=m" >> .config

          # Fix: Remove unsupported compiler flags from the kernel Makefile
          # The kernel was built with AOSP Clang r450784d which supports flags
          # that the system Clang doesn't. We need to filter them out.
          sed -i 's/-ftrivial-auto-var-init=zero//g' Makefile
          sed -i 's/-fconserve-stack//g' Makefile
          sed -i 's/-mrecord-mcount//g' Makefile
          sed -i 's/-fsanitize=bounds-strict//g' Makefile
          sed -i 's/-enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang//g' Makefile

          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- modules_prepare 2>&1 | tail -10

          # Build mac80211
          echo "=== Building mac80211 ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            M=net/mac80211 modules 2>&1 | tail -20

          # Build cfg80211
          echo "=== Building cfg80211 ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            M=net/wireless modules 2>&1 | tail -20

          echo "=== Kernel modules built ==="
          find . -name "mac80211.ko" -o -name "cfg80211.ko" 2>/dev/null
          cd ..

      - name: Build RTL8812AU.ko
        run: |
          cd drivers/rtl8812au
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export KDIR=${GITHUB_WORKSPACE}/kernel

          # Fix unsupported flags in the driver Makefile too
          sed -i 's/-fconserve-stack//g' Makefile
          sed -i 's/-ftrivial-auto-var-init=zero//g' Makefile
          sed -i 's/-mrecord-mcount//g' Makefile
          sed -i 's/-fsanitize=bounds-strict//g' Makefile

          echo "=== Building RTL8812AU ==="
          make ARCH=arm64 CC=clang CROSS_COMPILE=aarch64-linux-gnu- \
            KDIR=${KDIR} \
            EXTRA_CFLAGS="-DCONFIG_WIFI_MONITOR=1 -DCONFIG_CONCURRENT_MODE=1" \
            -j$(nproc) 2>&1 | tail -40

          echo "=== RTL8812AU result ==="
          find . -name "*.ko" -type f 2>/dev/null
          cd ..

      - name: Collect and Package
        run: |
          mkdir -p collected
          find kernel/ -name "mac80211.ko" -exec cp {} collected/ \; 2>/dev/null
          find kernel/ -name "cfg80211.ko" -exec cp {} collected/ \; 2>/dev/null
          find drivers/ -name "*.ko" -exec cp {} collected/ \; 2>/dev/null
          echo "=== Collected .ko files ==="
          ls -la collected/
          for f in collected/*.ko; do echo "---"; file "$f"; done

          MODULE_DIR="KSU_Omni_WiFi"
          mkdir -p "${MODULE_DIR}/system/lib/modules"
          mkdir -p "${MODULE_DIR}/common"
          cp collected/*.ko "${MODULE_DIR}/system/lib/modules/" 2>/dev/null || true

          printf 'id=KSU_Omni_WiFi\nname=KernelSU Omni WiFi Pack\nversion=1.0.0\nversionCode=1\nauthor=MDMisba97khan\ndescription=mac80211+cfg80211+rtl8812au for monitor mode on RMX3834\n' > "${MODULE_DIR}/module.prop"

          printf '#!/system/bin/sh\nMODPATH=${0%%/*}\nMDIR=${MODPATH}/system/lib/modules\nfor ko in cfg80211.ko mac80211.ko 8812au.ko rtl8812au.ko; do\n  [ -f "${MDIR}/${ko}" ] && insmod "${MDIR}/${ko}"\ndone\n' > "${MODULE_DIR}/common/service.sh"
          chmod +x "${MODULE_DIR}/common/service.sh"

          printf '#!/system/bin/sh\nMODDIR=${0%%/*}\nchmod 0644 ${MODDIR}/system/lib/modules/*.ko 2>/dev/null\n' > "${MODULE_DIR}/install.sh"
          chmod +x "${MODULE_DIR}/install.sh"

          printf '#!/system/bin/sh\nMODDIR=${0%%/*}\nfor ko in ${MODDIR}/system/lib/modules/*.ko; do\n  [ -f "$ko" ] && chmod 0644 "$ko"\ndone\n' > "${MODULE_DIR}/post-fs-data.sh"
          chmod +x "${MODULE_DIR}/post-fs-data.sh"

          zip -r -q KSU_Omni_WiFi_Pack.zip KSU_Omni_WiFi/
          echo "=== ZIP ==="
          unzip -l KSU_Omni_WiFi_Pack.zip
          ls -lh KSU_Omni_WiFi_Pack.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KSU_Omni_WiFi_Pack
          path: KSU_Omni_WiFi_Pack.zip
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: KSU_Omni_WiFi_Pack.zip
          tag_name: v1.0.0-${{ github.run_number }}
          name: "KSU Omni WiFi Pack v1.0.0 (#${{ github.run_number }})"
          body: |
            ## KernelSU Omni WiFi Pack
            **Device:** Realme Note 50 (RMX3834) • **Kernel:** 5.15.178-android13
            
            ### Modules included
            - cfg80211.ko — wireless configuration
            - mac80211.ko — 802.11 networking stack  
            - rtl8812au.ko — RTL8812AU USB adapter driver
            
            ### Supported: Alfa AWUS011ACS (USB ID: 0bda:c820)
            ### Features: Monitor Mode, Packet Injection
            
            ### Installation
            1. KernelSU-Next → Modules → Install from storage
            2. Select KSU_Omni_WiFi_Pack.zip
            3. Reboot
            4. Connect adapter via OTG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
